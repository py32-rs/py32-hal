[package]
name = "rtic-f072"
version = "0.4.1"
edition = "2024"
publish = false

[dependencies]
py32-hal = { path = "../../", features = ["embassy-usb-driver-impl", "time-driver-tim15", "py32f072c1b"] }
rtic = { version = "2.3", features = ["thumbv6-backend"] }

# Cortex-M0 lacks native compare-and-swap atomics.
portable-atomic = { version = "1", features = ["critical-section"] }

cortex-m = { version = "0.7.7", features = [
    "critical-section-single-core",
    "critical-section",
] }
cortex-m-rt = "0.7.5"
embassy-time = { version = "0.5", features = ["defmt", "defmt-timestamp-uptime", "generic-queue-8", "tick-hz-32_768"] }
embassy-usb = { version = "0.5", features = ["defmt"] }
heapless = "0.9"
static_cell = "2.1"
defmt = "1.1"
defmt-rtt = "1.2"
panic-probe = { version = "1.0", features = ["print-defmt"] }

# cargo build/run
[profile.dev]
codegen-units = 1
debug = 2
debug-assertions = true
incremental = false
opt-level = 'z'
overflow-checks = true

# cargo build/run --release
[profile.release]
codegen-units = 1
debug = 2
debug-assertions = false
incremental = false
lto = 'fat'
opt-level = 3
overflow-checks = false
